name: RideLink Continuous Integration

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Verify Microservices
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build & Run Unit Tests (All 4 Services)
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017
        run: ./mvnw clean test --batch-mode

      - name: Package Applications
        run: ./mvnw package -DskipTests --batch-mode
